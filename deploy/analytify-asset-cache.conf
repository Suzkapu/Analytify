# HTTP-context map; the security snippet emits a header only for successful,
# content-hashed build assets. Mutable HTML/PWA metadata and API paths do not match.
map "$status:$uri" $analytify_asset_cache_control {
    default "";
    "~^200:/(?:main|polyfills|runtime|styles|chunk)[.-][A-Za-z0-9_-]{8,}[.](?:js|css)$" "public, max-age=31536000, immutable";
    "~^200:/media/[A-Za-z0-9_-]+-[A-Za-z0-9]{8,}[.](?:woff2|woff|ttf)$" "public, max-age=31536000, immutable";
}
