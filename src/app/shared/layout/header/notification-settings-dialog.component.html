<div class="confirm-modal-overlay" (click)="close()">
  <section class="confirm-modal-card notification-settings-modal settings-sheet" role="dialog" aria-modal="true"
    aria-labelledby="notification-settings-title" aria-describedby="notification-settings-description"
    appAccessibleDialog (modalEscape)="close()" (click)="$event.stopPropagation()">
    <header class="settings-sheet-header">
      <span><i class="pi pi-bell" aria-hidden="true"></i></span>
      <div><h3 id="notification-settings-title">Notifications</h3><p id="notification-settings-description">Choose which updates you want to receive.</p></div>
      <button type="button" class="notification-modal-close" appModalInitialFocus (click)="close()"
        [disabled]="saving" aria-label="Close notification settings">×</button>
    </header>
    <div class="settings-sheet-body">
    @if (loading) {
      <div class="notification-settings-loading" role="status"><i class="pi pi-spin pi-spinner" aria-hidden="true"></i> Loading notification settings…</div>
    } @else {
      <section class="notification-device-block" [attr.data-tone]="deviceStatus.tone" aria-labelledby="notification-device-title">
        <i class="pi" [ngClass]="deviceStatus.tone === 'success' ? 'pi-check-circle' : deviceStatus.tone === 'danger' ? 'pi-ban' : 'pi-mobile'" aria-hidden="true"></i>
        <div><strong id="notification-device-title">{{ deviceStatus.title }}</strong><p>{{ deviceStatus.description }}</p></div>
      </section>
      <div class="notification-category-list">
        <label class="notification-category-row">
          <span class="notification-category-icon"><i class="pi pi-star" aria-hidden="true"></i></span>
          <span class="notification-category-copy">
            <strong>Song League pick windows</strong>
            <small>Remind me when weekly picks open.</small>
          </span>
          <span class="switch" title="Toggle Song League notifications">
            <input type="checkbox" [checked]="settings.songLeagueEnabled"
              [disabled]="saving || (!settings.supported && !settings.songLeagueEnabled) || (settings.permission === 'denied' && !settings.songLeagueEnabled)"
              (change)="toggleSongLeague($event)" aria-label="Song League notifications">
            <span class="slider round"></span>
          </span>
        </label>
        @if (settings.songLeagueMember) {
          <label class="notification-category-row">
            <span class="notification-category-icon"><i class="pi pi-volume-up" aria-hidden="true"></i></span>
            <span class="notification-category-copy">
              <strong>New Song League picks</strong>
            <small>Notify me when another member submits a song.</small>
            </span>
            <span class="switch" title="Toggle new Song League pick notifications">
              <input type="checkbox" [checked]="settings.songLeagueSongAddedEnabled"
                [disabled]="saving || (!settings.supported && !settings.songLeagueSongAddedEnabled) || (settings.permission === 'denied' && !settings.songLeagueSongAddedEnabled)"
                (change)="toggleSongAdded($event)" aria-label="New Song League pick notifications">
              <span class="slider round"></span>
            </span>
          </label>
        }
        <label class="notification-category-row">
          <span class="notification-category-icon"><i class="pi pi-eye" aria-hidden="true"></i></span>
          <span class="notification-category-copy">
            <strong>Stats access requests</strong>
            <small>Notify me when someone asks to view my stats.</small>
          </span>
          <span class="switch" title="Toggle stats access request notifications">
            <input type="checkbox" [checked]="settings.statsAccessRequestsEnabled"
              [disabled]="saving || (!settings.supported && !settings.statsAccessRequestsEnabled) || (settings.permission === 'denied' && !settings.statsAccessRequestsEnabled)"
              (change)="toggleStatsAccess($event)" aria-label="Stats access request notifications">
            <span class="slider"></span>
          </span>
        </label>
      </div>
    }
    @if (error) { <p class="notification-settings-error" role="alert">{{ error }}</p> }
    @if (message) { <p class="notification-settings-message" role="status">{{ message }}</p> }
    </div>
    <div class="confirm-modal-actions">
      <button type="button" class="confirm-modal-btn confirm-modal-btn-cancel" (click)="close()" [disabled]="saving">Done</button>
    </div>
  </section>
</div>
