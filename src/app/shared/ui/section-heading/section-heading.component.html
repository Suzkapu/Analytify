<header class="shared-section-heading">
  <span class="section-icon" aria-hidden="true"><i class="pi" [ngClass]="icon"></i></span>
  <div>
    @if (eyebrow) {
      <span class="page-eyebrow">{{ eyebrow }}</span>
    }
    <h2>{{ title }}</h2>
    @if (description) {
      <p>{{ description }}</p>
    }
  </div>
</header>
