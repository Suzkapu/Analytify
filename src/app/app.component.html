@if (isInitialNavigationLoading) {
  <div
    class="app-loading"
    role="status"
    aria-live="polite"
    aria-label="Loading Analytify"
    >
    <img src="assets/Analytify-384.webp" alt="">
    <div class="app-loading-spinner" aria-hidden="true"></div>
  </div>
}

@if (siteAnnouncement && announcementVisible) {
  <div
    class="site-announcement site-announcement-v2"
    [class.site-announcement-transient]="!isLandingAnnouncement"
    role="status"
    aria-live="polite"
    >
    <i class="pi pi-megaphone" aria-hidden="true"></i><span>{{ siteAnnouncement }}</span>
  </div>
}
<div id="app-content" class="app-route-content" tabindex="-1">
  <router-outlet/>
</div>

@if (updateReady) {
  <section class="app-update-notice" role="status" aria-labelledby="app-update-title">
    <div>
      <strong id="app-update-title">Analytify is ready to update</strong>
      <span>Reload when you are ready to use the latest version.</span>
    </div>
    <div class="app-update-notice__actions">
      <button type="button" (click)="dismissUpdate()">Later</button>
      <button type="button" class="app-update-notice__primary" (click)="reloadForUpdate()">Reload now</button>
    </div>
  </section>
}
