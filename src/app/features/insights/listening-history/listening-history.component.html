<app-header mobileTitle="Recently Played"></app-header>


<div class="stats-dashboard-container">
  <header class="page-hero history-page-heading">
    <div>
      <span class="page-eyebrow">Listening activity</span>
      <h1>Recently played</h1>
      <p>Your latest Spotify plays, ordered from newest to oldest.</p>
    </div>
  </header>

  <div class="stats-content-wrapper">
    <app-page-state *ngIf="isLoadingRecentlyPlayed" [loading]="true" icon="pi-spinner"
      title="Loading listening history…"></app-page-state>
    
    <app-page-state *ngIf="!isLoadingRecentlyPlayed && recentlyPlayedTracks.length === 0"
      icon="pi-history" title="No recent tracks"
      message="Your latest Spotify plays will appear here when they are available."></app-page-state>

    <div *ngIf="!isLoadingRecentlyPlayed && recentlyPlayedTracks.length > 0" class="listening-history-list">
      <div *ngFor="let item of recentlyPlayedTracks; let idx = index; trackBy: trackHistoryItem" class="track-row-card no-trend-pointer">
        <div class="track-index history-index">
          <span>#{{ idx + 1 }}</span>
          <time>{{ formatPlayedAt(item.played_at) }}</time>
        </div>
        <button type="button" class="spotify-artwork-link"
          [disabled]="!item.track.external_urls?.spotify"
          [attr.aria-label]="'Open ' + item.track.name + ' on Spotify'"
          title="Open on Spotify"
          (click)="openTrackClick(item.track.external_urls?.spotify); $event.stopPropagation()">
          <img
            [src]="item.track.album?.images && item.track.album.images[0] ? item.track.album.images[0].url : 'https://misc.scdn.co/liked-songs/liked-songs-300.png'"
            [alt]="item.track.name + ' cover'" class="track-cover" loading="lazy" decoding="async">
        </button>
        <div class="track-info">
          <span class="track-title">{{ item.track.name }}</span>
          <span class="track-artist">{{ getTrackArtist(item.track) }}</span>
        </div>
        <div class="track-meta">
          <span *ngIf="item.track.explicit" class="explicit-badge">E</span>
        </div>
      </div>
    </div>
  </div>
</div>



<app-footer></app-footer>
