<app-header mobileTitle="Join League"></app-header>
<main class="song-league-page league-claim-page">
  <section class="league-claim-card">
    <div class="league-claim-icon"><i class="pi" [ngClass]="isJoining ? 'pi-spin pi-spinner' : 'pi-exclamation-circle'"></i></div>
    <h1>{{ isJoining ? 'Joining Song League…' : 'Could not join league' }}</h1>
    <p *ngIf="isJoining">Checking the private invitation and your Cloud Backup status.</p>
    <p *ngIf="!isJoining">{{ errorMessage }}</p>
    <a *ngIf="!isJoining" routerLink="/song-league" class="league-primary">Go to Song League</a>
  </section>
</main>
