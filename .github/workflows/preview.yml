name: Verify and deploy development preview

on:
  push:
    branches: [codex/design-v2]
  pull_request:
    branches: [codex/design-v2]
  workflow_dispatch:
    inputs:
      friends_contract_only:
        description: Run only isolated Friends contracts without deployment
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.friends_contract_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm install --global npm@12.0.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: npm ci
      - run: npm ci --prefix services/sync-service --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node --test scripts/preview-nginx.test.mjs
      - run: npm run verify:ci
      - run: npm run test:coverage:instrumentation
      - run: npm run test:coverage:worker
      - run: npm run test:coverage:edge
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        id: supabase-cli
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Start isolated loading-contract stack
        run: >-
          supabase start --workdir integration
          -x studio,imgproxy,storage-api,realtime,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Export isolated loading-contract settings
        run: |
          supabase status --workdir integration -o env \
            --override-name api.url=SUPABASE_INTEGRATION_URL \
            --override-name auth.anon_key=SUPABASE_INTEGRATION_ANON_KEY \
            > /tmp/analytify-supabase-integration.env
          sed 's/"//g' /tmp/analytify-supabase-integration.env >> "$GITHUB_ENV"
      - run: npm run test:supabase-integration
      - name: Stop isolated loading-contract stack
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --workdir integration --no-backup
      - run: npm run accessibility:browser
      - name: Verify isolated Friends browser workflows
        run: npx playwright test --config=playwright.friends.config.ts
      - name: Verify native Angular feedback components
        run: npm run test:native-components
      - name: Verify isolated device Navigation preferences
        run: npx playwright test --config=playwright.navigation.config.ts
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-test-evidence-${{ github.sha }}
          path: |
            coverage
            test-results
            playwright-report
            docs/testing-evidence/design-v2/friends-browser-artifacts
            docs/testing-evidence/design-v2/navigation-browser-artifacts
            e2e/components/__screenshots__
          retention-days: 7
      - name: Record preview artifact identity
        run: node -e 'require("node:fs").writeFileSync("dist/spoti-front/version.json",JSON.stringify({commit:process.env.GITHUB_SHA,branch:"codex/design-v2",mount:"/new/"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-web-${{ github.sha }}
          path: dist/spoti-front
          if-no-files-found: error
          retention-days: 1
  friends-http-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm install --global npm@12.0.2
      - name: Restrict preinstalled PostgreSQL share permissions
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ImageOS" = ubuntu24
          friends_share_directories=(
            /usr/share
            /usr/share/postgresql
            /usr/share/postgresql/16
            /usr/share/postgresql/16/extension
          )
          friends_control=/usr/share/postgresql/16/extension/pgcrypto.control
          for friends_directory in "${friends_share_directories[@]}"; do
            test -d "$friends_directory"
            test ! -L "$friends_directory"
            test "$(realpath -- "$friends_directory")" = "$friends_directory"
            test "$(stat -c %u -- "$friends_directory")" -eq 0
          done
          test -f "$friends_control"
          test ! -L "$friends_control"
          test "$(realpath -- "$friends_control")" = "$friends_control"
          test "$(stat -c %u -- "$friends_control")" -eq 0
          stat -c '%n uid=%u mode=%a' -- "${friends_share_directories[@]}" "$friends_control"
          sudo chmod go-w -- "${friends_share_directories[@]}" "$friends_control"
          stat -c '%n uid=%u mode=%a' -- "${friends_share_directories[@]}" "$friends_control"
      - run: npm ci
      - run: node --test scripts/provision-isolated-friends-runtime.test.mjs
      - run: node integration/friends-http/verify-isolation.mjs
      - name: Verify selected real Friends HTTP and Angular contracts
        run: |
          mkdir -p docs/testing-evidence/design-v2/friends-http-ci-artifacts
          node scripts/provision-isolated-friends-runtime.mjs > docs/testing-evidence/design-v2/friends-http-ci-artifacts/runtime.json
          ANALYTIFY_TEST_POSTGRES_ROOT="$(jq -er .postgresRoot docs/testing-evidence/design-v2/friends-http-ci-artifacts/runtime.json)" \
          ANALYTIFY_TEST_POSTGREST_ROOT="$(jq -er .postgrestRoot docs/testing-evidence/design-v2/friends-http-ci-artifacts/runtime.json)" \
          node scripts/test-isolated-friends-http-contract.mjs --angular-contract > docs/testing-evidence/design-v2/friends-http-ci-artifacts/contract.log 2>&1
      - name: Preserve isolated contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: friends-http-contract-${{ github.sha }}
          path: docs/testing-evidence/design-v2/friends-http-ci-artifacts
          retention-days: 7
  deploy:
    needs: [verify, friends-http-contract]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/design-v2' && (github.event_name != 'workflow_dispatch' || !inputs.friends_contract_only)
    runs-on: ubuntu-latest
    # Serialize Nginx configuration writes with stable releases, without ever
    # replacing their frontend artifacts or running their backend deployment.
    concurrency:
      group: analytify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-web-${{ github.sha }}
          path: dist/spoti-front
      - name: Deploy only the separate preview frontend
        env:
          DEPLOY_HOST: analytify.dynv6.net
          DEPLOY_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_TARGET: ${{ secrets.TARGET_DIR }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-preview.sh
