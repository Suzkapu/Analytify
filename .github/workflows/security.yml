name: Supply-chain security

env:
  NPM_VERSION: 12.0.2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  advisory-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix services/sync-service --ignore-scripts

      - name: Reject high and critical advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix services/sync-service --audit-level=high

      - name: Generate CycloneDX SBOMs
        run: |
          npm sbom --sbom-format=cyclonedx > analytify-web.cdx.json
          npm sbom --prefix services/sync-service --sbom-format=cyclonedx > analytify-sync-service.cdx.json

      - name: Publish SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analytify-sbom-${{ github.sha }}
          path: |
            analytify-web.cdx.json
            analytify-sync-service.cdx.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
