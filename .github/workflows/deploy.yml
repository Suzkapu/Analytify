name: Verify and deploy

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      # This hostname is public and should not be hidden in a repository secret.
      # Keeping it here also prevents a malformed REMOTE_HOST secret from making
      # ssh interpret a URL or other value as a DNS name.
      DEPLOY_HOST: analytify.dynv6.net
      SUPABASE_PROJECT_REF: tmmhylpexbubyznlizfs
      SPOTIFY_CLIENT_ID: 9b03c8eb85dd4df483c3ae097e6c39f0
      SUPABASE_URL: https://tmmhylpexbubyznlizfs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_hMg6wOlMTQai9ipA4ZlxzQ_rawnrTD-
      WEB_PUSH_VAPID_PUBLIC_KEY: BIpszothnaePO-LGeIvE4x7AEKMr2YdiyuJZWjkMIlHqPe1Tp3WE79_otTv_C_pQ2C9JwfsnlqcoQn0aVEVcANA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tests and production build
        run: npm run verify:ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start isolated Supabase loading-test stack
        run: >-
          supabase start --workdir integration
          -x studio,imgproxy,storage-api,realtime,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Export isolated Supabase browser-test settings
        run: |
          supabase status --workdir integration -o env \
            --override-name api.url=SUPABASE_INTEGRATION_URL \
            --override-name auth.anon_key=SUPABASE_INTEGRATION_ANON_KEY \
            > /tmp/analytify-supabase-integration.env
          sed 's/"//g' /tmp/analytify-supabase-integration.env >> "$GITHUB_ENV"

      - name: Verify real Supabase-first playlist and stats loading
        run: npm run test:supabase-integration

      - name: Stop isolated Supabase loading-test stack
        if: always()
        run: supabase stop --workdir integration --no-backup

      - name: Validate deployment script
        run: bash -n scripts/deploy.sh scripts/deploy-supabase.sh

      - name: Deploy Supabase schema and functions
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_TOKEN_ENCRYPTION_KEY: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: bash scripts/deploy-supabase.sh

      - name: Deploy verified build to Oracle Server
        # Every branch push represents a deployable live version. Pull-request
        # events still verify only, so fork PRs never receive deployment secrets.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_TARGET: ${{ secrets.TARGET_DIR }}
          ADMIN_SPOTIFY_IDS: ${{ secrets.ADMIN_SPOTIFY_IDS }}
          SPOTIFY_TOKEN_ENCRYPTION_KEY: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}
        run: bash scripts/deploy.sh

      - name: Verify live deployment
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          APP_URL: https://analytify.dynv6.net
        run: node scripts/verify-live-deployment.mjs
