name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # These values are public application configuration, not credentials.
  NPM_VERSION: 12.0.2
  DEPLOY_HOST: analytify.dynv6.net
  SUPABASE_PROJECT_REF: tmmhylpexbubyznlizfs
  SPOTIFY_CLIENT_ID: 9b03c8eb85dd4df483c3ae097e6c39f0
  SUPABASE_URL: https://tmmhylpexbubyznlizfs.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_hMg6wOlMTQai9ipA4ZlxzQ_rawnrTD-
  WEB_PUSH_VAPID_PUBLIC_KEY: BIpszothnaePO-LGeIvE4x7AEKMr2YdiyuJZWjkMIlHqPe1Tp3WE79_otTv_C_pQ2C9JwfsnlqcoQn0aVEVcANA

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Use the pinned npm release
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Install dependencies
        run: npm ci

      - name: Install locked sync-worker dependencies
        run: npm ci --prefix services/sync-service --ignore-scripts

      - name: Record test runtime versions
        run: |
          node --version > test-runtime-versions.txt
          npm --version >> test-runtime-versions.txt
          deno --version >> test-runtime-versions.txt
          google-chrome --version >> test-runtime-versions.txt

      - name: Verify tests and production build
        run: npm run verify:ci

      - name: Assemble and retest the exact production worker
        run: |
          npm prune --prefix services/sync-service --omit=dev --ignore-scripts
          printf '%s\n' "$GITHUB_SHA" > services/sync-service/.deployed-commit
          npm run sync-service:check
          npm sbom --prefix services/sync-service --omit=dev --sbom-format=cyclonedx > analytify-worker.cdx.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf analytify-worker.tar.gz -C services sync-service
          sha256sum analytify-worker.tar.gz analytify-worker.cdx.json > analytify-worker.sha256

      - name: Publish browser coverage and runtime manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analytify-test-evidence-${{ github.sha }}
          path: |
            coverage/SpotiFront
            test-runtime-versions.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start isolated Supabase loading-test stack
        run: >-
          supabase start --workdir integration
          -x studio,imgproxy,storage-api,realtime,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Export isolated Supabase browser-test settings
        run: |
          supabase status --workdir integration -o env \
            --override-name api.url=SUPABASE_INTEGRATION_URL \
            --override-name auth.anon_key=SUPABASE_INTEGRATION_ANON_KEY \
            > /tmp/analytify-supabase-integration.env
          sed 's/"//g' /tmp/analytify-supabase-integration.env >> "$GITHUB_ENV"

      - name: Verify real Supabase-first playlist and stats loading
        run: npm run test:supabase-integration

      - name: Stop isolated Supabase loading-test stack
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --workdir integration --no-backup

      - name: Rebuild and test the complete schema from empty
        run: |
          supabase start --workdir . \
            -x studio,imgproxy,storage-api,realtime,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
          supabase db reset --workdir .
          supabase db lint --workdir . --level error
          supabase test db --workdir .

      - name: Stop schema-rehearsal stack
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --workdir . --no-backup

      - name: Validate deployment scripts
        run: bash -n scripts/deploy.sh scripts/deploy-supabase.sh scripts/activate-release.sh scripts/install-nginx-security.sh scripts/assert-deployment-freshness.sh

      - name: Store verified production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analytify-web-${{ github.sha }}
          path: dist/spoti-front
          if-no-files-found: error
          retention-days: 1

      - name: Store verified production worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analytify-worker-${{ github.sha }}
          path: |
            analytify-worker.tar.gz
            analytify-worker.cdx.json
            analytify-worker.sha256
          if-no-files-found: error
          retention-days: 14

  security-advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix services/sync-service --ignore-scripts

      - name: Reject high and critical advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix services/sync-service --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  deploy-production:
    needs: [verify, security-advisories, codeql]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: analytify-production
      cancel-in-progress: true
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Restore verified production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analytify-web-${{ github.sha }}
          path: dist/spoti-front

      - name: Restore the exact production worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analytify-worker-${{ github.sha }}
          path: .verified-worker

      - name: Verify and extract the production worker
        run: |
          cd .verified-worker
          sha256sum --check analytify-worker.sha256
          mkdir extracted
          tar -xzf analytify-worker.tar.gz -C extracted
          test "$(cat extracted/sync-service/.deployed-commit)" = "$GITHUB_SHA"
          test -d extracted/sync-service/node_modules

      - name: Reject superseded deployment before Supabase mutation
        run: bash scripts/assert-deployment-freshness.sh "$GITHUB_REF" "$GITHUB_SHA"

      - name: Verify pinned Oracle SSH identity before any mutation
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.REMOTE_USER }}
        run: bash scripts/preflight-oracle-ssh.sh

      - name: Deploy Supabase schema and functions
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_TOKEN_ENCRYPTION_KEY: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}
          SPOTIFY_TOKEN_ENCRYPTION_KEYS: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEYS }}
          SPOTIFY_TOKEN_ENCRYPTION_WRITE_VERSION: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_WRITE_VERSION }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: bash scripts/deploy-supabase.sh

      - name: Reject superseded deployment before Oracle mutation
        run: bash scripts/assert-deployment-freshness.sh "$GITHUB_REF" "$GITHUB_SHA"

      - name: Deploy verified build to Oracle Server
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_TARGET: ${{ secrets.TARGET_DIR }}
          ADMIN_SPOTIFY_IDS: ${{ secrets.ADMIN_SPOTIFY_IDS }}
          SPOTIFY_TOKEN_ENCRYPTION_KEY: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}
          SPOTIFY_TOKEN_ENCRYPTION_KEYS: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEYS }}
          SPOTIFY_TOKEN_ENCRYPTION_WRITE_VERSION: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_WRITE_VERSION }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || env.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          WORKER_ARTIFACT_DIR: ${{ github.workspace }}/.verified-worker/extracted/sync-service
        run: bash scripts/deploy.sh

      - name: Verify every live component runs the intended commit
        env:
          APP_URL: https://analytify.dynv6.net
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-live-deployment.mjs
