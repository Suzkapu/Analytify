version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"

  - package-ecosystem: npm
    directory: /services/sync-service
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
